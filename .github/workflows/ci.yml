name: CI/CD
on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.98.1"
jobs:
  build:
    name: Rust ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, platform: linux, arch: amd64, target: x86_64-unknown-linux-gnu }
          - { runner: ubuntu-24.04-arm, platform: linux, arch: arm64, target: aarch64-unknown-linux-gnu }
          - { runner: macos-15-intel, platform: darwin, arch: amd64, target: x86_64-apple-darwin }
          - { runner: macos-15, platform: darwin, arch: arm64, target: aarch64-apple-darwin }
          - { runner: windows-2022, platform: windows, arch: amd64, target: x86_64-pc-windows-gnu, msystem: UCRT64, prefix: mingw-w64-ucrt-x86_64, compiler: gcc, ffmpeg_arch: x86_64, host: x86_64-w64-mingw32, opus_flags: "" }
          - { runner: windows-11-arm, platform: windows, arch: arm64, target: aarch64-pc-windows-gnullvm, msystem: CLANGARM64, prefix: mingw-w64-clang-aarch64, compiler: clang, ffmpeg_arch: aarch64, host: aarch64-w64-mingw32, opus_flags: "--disable-rtcd --disable-asm" }
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
      - name: Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool pkg-config curl xz-utils tar ffmpeg
      - name: macOS build tools
        if: runner.os == 'macOS'
        run: |
          brew install autoconf automake libtool pkgconf coreutils gnu-tar make xz ffmpeg
          echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"
          echo "$(brew --prefix gnu-tar)/libexec/gnubin" >> "$GITHUB_PATH"
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"
      - name: Windows build tools
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          path-type: inherit
          update: true
          install: >-
            base-devel autoconf automake libtool make curl tar xz zip
            ${{ matrix.prefix }}-pkgconf ${{ matrix.prefix }}-toolchain ${{ matrix.prefix }}-ffmpeg
      - name: Rust toolchain
        shell: bash
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt --component clippy
          rustup target add --toolchain "$RUST_VERSION" "${{ matrix.target }}"
      - name: Unix checks and build
        if: runner.os != 'Windows'
        shell: bash
        env:
          JOBS: "2"
        run: |
          ./scripts/bootstrap-static-audio-deps.sh
          export PKG_CONFIG_PATH="$PWD/third_party/ffmpeg-audio/lib/pkgconfig"
          cargo fmt --all --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
          cargo build --locked --release
          ./target/release/qwen-stt-compatible --help
          sh scripts/package.sh "${{ matrix.platform }}" "${{ matrix.arch }}" target/release/qwen-stt-compatible
      - name: Windows checks and build
        if: runner.os == 'Windows'
        shell: msys2 {0}
        env:
          CC: ${{ matrix.compiler }}
          CARGO_BUILD_TARGET: ${{ matrix.target }}
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: gcc
          CARGO_TARGET_AARCH64_PC_WINDOWS_GNULLVM_LINKER: clang
          RUSTFLAGS: -C target-feature=+crt-static -C link-arg=-static
          PKG_CONFIG_ALLOW_CROSS: "1"
          FFMPEG_CONFIGURE_FLAGS: --arch=${{ matrix.ffmpeg_arch }} --target-os=mingw32
          DEPENDENCY_CONFIGURE_FLAGS: --host=${{ matrix.host }} --build=${{ matrix.host }}
          OPUS_CONFIGURE_FLAGS: ${{ matrix.opus_flags }}
          JOBS: "2"
        run: |
          ./scripts/bootstrap-static-audio-deps.sh
          export PKG_CONFIG_PATH="$PWD/third_party/ffmpeg-audio/lib/pkgconfig"
          cargo fmt --all --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
          cargo build --locked --release
          ./target/${{ matrix.target }}/release/qwen-stt-compatible.exe --help
          sh scripts/package.sh windows "${{ matrix.arch }}" "target/${{ matrix.target }}/release/qwen-stt-compatible.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: qwen-stt-compatible-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/upload/*
          if-no-files-found: error
  release-latest:
    name: Latest release
    needs: build
    runs-on: ubuntu-24.04
    if: github.event_name != 'pull_request' && (github.ref_name == github.event.repository.default_branch || github.event_name == 'workflow_dispatch')
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Checksums and Latest tag
        run: |
          (cd release-assets && sha256sum *.tar.gz *.zip > SHA256SUMS)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f Latest "$GITHUB_SHA"
          git push --force origin refs/tags/Latest
      - uses: ncipollo/release-action@v1
        with:
          tag: Latest
          name: Latest
          commit: ${{ github.sha }}
          body: Rolling Rust release generated from `${{ github.sha }}`.
          artifacts: release-assets/*
          allowUpdates: true
          removeArtifacts: true
          replacesArtifacts: true
          artifactErrorsFailBuild: true
          makeLatest: true

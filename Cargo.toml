[package]
name = "qwen-stt-compatible"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "GPL-3.0-or-later"

[dependencies]
anyhow = "1"
async-stream = "0.3"
axum = { version = "0.8", features = ["multipart", "ws"] }
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
humantime = "2"
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "native-tokio", "ring", "tls12"] }
hyper-util = { version = "0.1", features = ["tokio", "client-legacy", "client-proxy", "http1"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "http2", "json", "multipart", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smartaudio = { git = "https://github.com/Joey-Kot/ASR-Audio-Preprocess", rev = "8e132bf8eddd361c2a03c074d9da85e0e5298dd2" }
subtle = "2"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-native-roots"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
tower-http = { version = "0.6", features = ["cors"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
hound = "3.5"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http2"] }

[profile.release]
lto = "thin"
strip = true
